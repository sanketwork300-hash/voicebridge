name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11-3.13 is the range where the optional ASR extra is installable.
        # 3.14 is included to prove core and mock mode still work without it.
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint
        run: ruff check voicebridge tests

      # The entire suite runs in mock mode: no GPU, no model downloads.
      # If this ever needs either, the change is wrong.
      - name: Test
        run: pytest -q

      - name: End-to-end demo
        run: pytest tests/e2e -q

      - name: Benchmark harness smoke test
        run: python benchmarks/run_benchmark.py --synthetic --seconds 10 --all-pairs

  gateway:
    name: gateway smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e '.[dev]'
      - name: Start gateway and exercise the API
        run: |
          voicebridge-gateway &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/ready
          curl -fsS http://127.0.0.1:8000/v1/providers > /dev/null
          SID=$(curl -fsS -X POST http://127.0.0.1:8000/v1/sessions \
                 -H 'content-type: application/json' \
                 -d '{"source_language":"ja","target_language":"en"}' \
                | python -c 'import sys,json; print(json.load(sys.stdin)["session_id"])')
          curl -fsS "http://127.0.0.1:8000/v1/sessions/$SID" > /dev/null
          curl -fsS -X DELETE "http://127.0.0.1:8000/v1/sessions/$SID" > /dev/null

  extension:
    name: extension checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Validate manifest
        run: |
          node -e "
            const m = require('./apps/browser-extension/manifest.json');
            if (m.manifest_version !== 3) throw new Error('must be MV3');
            for (const p of ['tabCapture','offscreen','storage'])
              if (!m.permissions.includes(p)) throw new Error('missing permission: ' + p);
            console.log('manifest ok:', m.name, m.version);
          "
      - name: Syntax-check extension sources
        run: |
          for f in $(find apps/browser-extension -name '*.js'); do
            node --check "$f" || exit 1
          done
          echo "all extension sources parse"

  docker:
    name: docker mock image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run mock profile
        run: |
          docker compose -f deploy/compose/docker-compose.yml --profile mock build
          docker compose -f deploy/compose/docker-compose.yml --profile mock up -d
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 3
          done
          curl -fsS http://127.0.0.1:8000/health
          docker compose -f deploy/compose/docker-compose.yml --profile mock down
