# VoiceBridge configuration.
#
# Default: MOCK MODE -- the whole UI, API, job system and FFmpeg rendering run
# with no models, no GPU and no network; nothing is actually recognised or
# translated. For real models start from config/examples/cascade-cpu.yaml, or
# switch the providers below (commented examples).
#
# Every value can be overridden by environment variables (VOICEBRIDGE_*).
# Secrets (API tokens, LLM keys) come from the environment only.

server:
  host: 127.0.0.1        # bind to 0.0.0.0 only behind a reverse proxy
  port: 8000
  log_level: info

security:
  # api_token: set VOICEBRIDGE_API_TOKEN in the environment instead.
  cors_origins: ["*"]
  allowed_ws_origins: []           # e.g. ["chrome-extension://*"]; required off-localhost
  max_sessions: 8
  max_session_seconds: 14400
  max_audio_frames_per_second: 100

application:
  mode: production

pipeline:
  mode: cascade                    # cascade | seamless_streaming | benchmark

runtime:
  device: auto                     # auto -> cuda, mps, cpu
  dtype: auto                      # fp16/bf16 on GPU, bf16 on BF16-capable CPUs
  warmup: [asr]                    # loaded at startup; others load on first use
  low_memory: false                # file jobs release the LLM before TTS
  # profile: cpu                   # one of runtime_profiles below

languages:
  source: [auto, ja, ko, en]
  target: [en, hi]

honorific_policy:
  mode: preserve                   # preserve | naturalize | remove

glossary: []
#  - source: "特定の名前"
#    target: "Specific Name"

providers:
  asr:
    provider: mock
    # provider: whisperlivekit
    # model: openai/whisper-large-v3-turbo
    # backend_policy: localagreement
    # compute_type: int8           # faster-whisper file mode on CPU
    # prompt_previous_text: false  # see docs/evaluation.md before enabling

  speech_gate:
    enabled: false                 # true needs the asr + speech-gate extras
    vad: silero
    event_classifier: ast
    dialogue_threshold: 0.35
    non_speech_threshold: 0.60
    realtime_event_classifier: auto  # live sessions: on for GPU, off on CPU (AST is slower than real time there)
    transcribe_unknown: true
    window_seconds: 0.6

  asr_validation: {}               # thresholds: no_speech_threshold, min_avg_logprob, ...

  translation:
    provider: mock
    # provider: contextual
    # backend: transformers        # transformers | openai | anthropic
    # model: Qwen/Qwen3-1.7B
    # context_segments: 8
    # context: {max_tokens: 2048}
    # validation: balanced         # strict | balanced | fast

  # translation_presets:           # UI "Translation quality"
  #   fast: {provider: opus_mt}
  #   balanced: {provider: contextual, backend: transformers, model: Qwen/Qwen3-1.7B}
  #   high_quality: {provider: contextual, backend: transformers, model: Qwen/Qwen3-4B-Instruct-2507}

  # fallback_translation:
  #   provider: opus_mt

  # English -> Hindi with IndicTrans2 (MIT):
  # translation: {provider: indictrans2, large: false, num_beams: 5}
  # NLLB covers every pair but its weights are CC-BY-NC-4.0 (research mode):
  # translation: {provider: nllb, acknowledge_non_commercial: true}

  tts:
    provider: mock
    # provider: qwen3
    # model: Qwen/Qwen3-TTS-12Hz-1.7B-Base
    # default_voice: source        # clone each speaker from the source audio
    # idle_unload_seconds: 300
    # timing: {enabled: true, max_rate: 1.20, min_rate: 0.85, duration_tolerance: 0.15}

  # fallback_tts:                  # languages the primary TTS lacks (e.g. Hindi)
  #   provider: piper
  #   voices: {hi: models/piper/hi_IN-priyamvada-medium.onnx}

  s2st:
    seamless_streaming:
      enabled: false               # CC-BY-NC-4.0 weights: enable only after licence review
      model: facebook/seamless-streaming
      device: auto
      dtype: auto
    seamless_m4t_v2:
      enabled: false               # CC-BY-NC-4.0
      model: facebook/seamless-m4t-v2-large

media:
  max_file_size_mb: 2048
  max_duration_seconds: 14400
  processing_timeout_seconds: 21600
  disk_quota_gb: 50
  job_workers: 1
  retention_hours: 72             # finished jobs (uploads + outputs) are deleted after this
  subtitles: true
  # ffmpeg_path: /usr/bin/ffmpeg   # else VOICEBRIDGE_FFMPEG, else PATH
  # ffprobe_path: /usr/bin/ffprobe

storage:
  backend: local
  root: storage

benchmark:
  results_dir: benchmark/results

# Machine-readable model matrix: see voicebridge/model_registry.py; entries
# here add to or override it (served at GET /api/v1/models).
models: {}

runtime_profiles:                  # defaults only -- not claims that a model fits
  cpu: {device: cpu, low_memory: true}
  gpu_8gb: {device: cuda, max_concurrency: 1}
  gpu_16gb: {device: cuda, max_concurrency: 1}
  gpu_24gb: {device: cuda, max_concurrency: 2}
