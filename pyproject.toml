[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voicebridge"
version = "0.1.0"
description = "Self-hostable real-time speech-to-speech translation engine"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["speech-translation", "asr", "streaming", "subtitles", "tts", "real-time"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The base install is deliberately tiny: it runs the gateway, the whole core
# pipeline and mock mode. Nothing here pulls in PyTorch, so `pip install
# voicebridge` stays fast and works on any platform. Real models are extras.
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "websockets>=12",
  "numpy>=1.24",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# ---- grouped extras ---------------------------------------------------------
# Streaming + offline ASR (WhisperLiveKit / faster-whisper; bundles Silero VAD).
# WhisperLiveKit pins Python <3.14, so this extra is empty on 3.14+.
asr = ["whisperlivekit>=0.2.26; python_version < '3.14'", "soundfile>=0.12"]
# Speech gate audio-event classifier (AST, via transformers).
speech-gate = ["torch>=2.1", "transformers>=4.45", "soundfile>=0.12"]
# Local translation: OPUS-MT, NLLB, and the contextual LLM provider's
# `transformers` backend.
translation = ["torch>=2.1", "transformers>=4.45", "sentencepiece>=0.1.99"]
# Contextual provider's `anthropic` backend (the `openai` backend needs nothing).
translation-api = ["anthropic>=0.40"]
# Piper TTS. NOTE: piper-tts >= 1.3 is GPL-3.0-or-later (OHF-Voice/piper1-gpl).
tts = ["piper-tts>=1.2"]
# Media I/O helpers. FFmpeg itself is a *system* dependency (see README).
media = ["soundfile>=0.12", "scipy>=1.10"]
benchmark = ["sacrebleu>=2.4", "psutil>=5.9", "soundfile>=0.12"]
# Qwen3-TTS / Qwen3-ASR and Meta Seamless run in separate worker virtualenvs
# (their pinned dependencies conflict with the gateway's): see
# scripts/setup_workers.sh. These extras are intentionally empty.
asr-qwen = []
tts-qwen = []
s2st-seamless = []

# ---- backward-compatible names ---------------------------------------------
asr-whisperlivekit = ["voicebridge[asr]"]
translation-local = ["voicebridge[translation]"]
translation-indic = [
  "torch>=2.0", "transformers>=4.40", "sentencepiece>=0.1.99",
  "IndicTransToolkit>=1.0",
]
tts-piper = ["voicebridge[tts]"]
audio-device = ["sounddevice>=0.4.6"]

dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.4",
]

# Everything that installs on a CPU-only machine without a GPU-specific wheel.
all = [
  "voicebridge[asr,speech-gate,translation,tts,media,benchmark,audio-device]",
]

[project.scripts]
voicebridge = "voicebridge.apps.cli.main:main"
voicebridge-gateway = "voicebridge.apps.gateway.main:main"

[project.urls]
Homepage = "https://github.com/voicebridge/voicebridge"
Documentation = "https://github.com/voicebridge/voicebridge/tree/main/docs"
Issues = "https://github.com/voicebridge/voicebridge/issues"

[tool.setuptools.packages.find]
include = ["voicebridge*"]

[tool.setuptools.package-data]
voicebridge = ["apps/gateway/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: requires model downloads or real hardware",
  "benchmark: measures performance, not correctness",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
